# Release workflow — builds installers for all three OSes with tauri-action and
# publishes ONE GitHub release containing every platform artifact (v1 shipped
# three separate per-OS releases; this replaces that).
#
# Trigger: push a tag like v2.0.0. Version numbers must already be bumped in
# package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml (see
# BUILDING.md → Release process).
#
# NOTE: this uses the automatic `secrets.GITHUB_TOKEN` — the old repo-level
# GH_TOKEN secret from the v1 Electron workflow is no longer needed and can be
# deleted.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          # 24.04, not 22.04: xcap's libspa bindings need PipeWire >= 1.0
          # headers (22.04 ships 0.3.48, which no longer matches the crate).
          - platform: ubuntu-24.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cross-compilation targets are only needed on the macOS runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        # Beyond the standard Tauri set: xcap (native screen capture for the
        # vision feature) builds against PipeWire/Wayland/EGL/DBus dev libs.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libdrm-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced by tauri-action with the app version from
          # tauri.conf.json — all four matrix jobs upload into this ONE release.
          # The release is created as a DRAFT so it stays invisible while the
          # platform installers stream in; when every job is green the
          # release-notes job below fills in the real changes, then open
          # Releases → the vX.Y.Z draft → Publish.
          tagName: v__VERSION__
          releaseName: 'Convai Desktop Pets v__VERSION__'
          releaseBody: 'Release notes are being generated…'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # Replace the placeholder body of the draft with the actual changes: one
  # bullet per commit since the previous tag, plus a compare link. Runs only
  # after every platform uploaded, so publishing the draft is the last step.
  release-notes:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write commit-based notes into the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          {
            echo "## Changes"
            echo ""
            if [ -n "$PREV" ]; then
              git log --no-merges --pretty='- %s' "${PREV}..${TAG}"
              echo ""
              echo "**Full changelog:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              git log --no-merges --pretty='- %s' "${TAG}"
            fi
            echo ""
            echo "Download the installer for your OS below (Windows: .exe · macOS: .dmg · Linux: .deb / .AppImage)."
          } > notes.md
          # Drafts are invisible to /releases/tags/:tag — look the id up by tag.
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | .id" | head -1)
          jq -n --rawfile body notes.md '{body: $body}' \
            | gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RID}" --input - > /dev/null
          echo "Release ${TAG} (id ${RID}) notes updated:"
          cat notes.md

# Release workflow — builds installers for all three OSes with tauri-action and
# publishes ONE GitHub release containing every platform artifact (v1 shipped
# three separate per-OS releases; this replaces that).
#
# Trigger: push a tag like v2.0.0. Version numbers must already be bumped in
# package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml (see
# BUILDING.md → Release process).
#
# NOTE: this uses the automatic `secrets.GITHUB_TOKEN` — the old repo-level
# GH_TOKEN secret from the v1 Electron workflow is no longer needed and can be
# deleted.
name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest # Intel
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Cross-compilation targets are only needed on the macOS runners.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        # Beyond the standard Tauri set: xcap (native screen capture for the
        # vision feature) builds against PipeWire/Wayland/EGL/DBus dev libs.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libwayland-dev \
            libegl1-mesa-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # __VERSION__ is replaced by tauri-action with the app version from
          # tauri.conf.json — all four matrix jobs upload into this ONE release.
          # The release is created as a DRAFT so it stays invisible while the
          # platform installers stream in; when every job is green, open
          # Releases → the vX.Y.Z draft → Publish. Watchers then get a single
          # complete announcement with all platforms attached.
          tagName: v__VERSION__
          releaseName: 'Convai Desktop Pets v__VERSION__'
          releaseBody: >
            AI-powered desktop companions built with Tauri and Convai.
            See the [README](https://github.com/AkshitIreddy/convai-desktop-pet#readme)
            for what's inside, then download the installer for your OS below
            (Windows: .exe · macOS: .dmg · Linux: .deb / .AppImage).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
